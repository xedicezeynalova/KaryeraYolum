
# ==========================================
# KaryeraYolum - Spring Boot konfiqurasiyasi
# ==========================================

spring.application.name=karyera-meslehetci
server.port=8080

# ==========================================
# H2 verilənlər bazası
# ==========================================

spring.datasource.url=jdbc:h2:mem:karyeradb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# H2 Console
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Ollama lokal AI
# ==========================================

ai.service.url=http://localhost:11434
ai.connect-timeout=10
ai.read-timeout=120

# Istifade olunacaq Ollama modeli
openai.model=qwen2.5:3b
